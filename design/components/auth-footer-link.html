<!--
  Auth Footer Link — "Don't have an account? Sign up" / "Already have an account? Log in"
  
  Placeholders:
    {{TEXT}}      — prompt text (e.g. "Don't have an account? ")
    {{LINK_TEXT}} — link label (e.g. "Sign up")
-->
<div style="display: flex; justify-content: center;">
  <div>
    <div style="display: inline-block; font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 400; color: #71717A; line-height: 18px;">{{TEXT}}</div>
    <div style="display: inline-block; font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 500; color: #09090B; line-height: 18px;">{{LINK_TEXT}}</div>
  </div>
</div>
