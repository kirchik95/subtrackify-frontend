<!--
  Danger Zone Card — destructive action section
  
  Placeholders:
    {{TITLE}}       — heading (e.g. "Danger Zone")
    {{DESCRIPTION}} — warning text
    {{BUTTON_TEXT}} — action button label (e.g. "Delete Account")
-->
<div layer-name="Danger Zone Card" style="display: flex; flex-direction: column; flex-grow: 1; flex-basis: 0%; justify-content: space-between; gap: 24px; padding: 32px; background-color: #FEF2F2; border: 1px solid #FECACA; border-radius: 24px; box-shadow: #00000005 0px 4px 12px;">
  <div style="display: flex; flex-direction: column; gap: 16px;">
    <div style="font-family: 'Inter', system-ui, sans-serif; font-size: 18px; font-weight: 600; color: #991B1B; line-height: 22px;">{{TITLE}}</div>
    <div style="font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 400; color: #991B1B; line-height: 22px;">{{DESCRIPTION}}</div>
  </div>
  <div style="display: flex;">
    <div style="display: flex; align-items: center; justify-content: center; padding: 10px 16px; background-color: #DC2626; border-radius: 12px;">
      <div style="font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 500; color: #FFFFFF; line-height: 18px;">{{BUTTON_TEXT}}</div>
    </div>
  </div>
</div>
