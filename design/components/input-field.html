<!--
  Input Field — label + input pair
  
  Placeholders:
    {{LABEL}} — field label (e.g. "First Name")
    {{VALUE}} — input value or placeholder text (e.g. "John")
  
  Variants (adjust styles after insertion):
    - Filled:      color: #09090B (default)
    - Placeholder: color: #A1A1AA
    - Disabled:    background-color: #FAFAFA; color: #71717A
    - Error:       border: 2px solid #DC2626; background-color: #FEF2F2
                   Add error message div below: font-size: 13px; color: #DC2626
  
  Auth variant: same HTML, but set width: 400px on parent and remove
  flex-grow/flex-shrink/flex-basis. Padding stays 12px 16px, radius 12px.
  
  Layout: uses flex-grow by default. For side-by-side fields, wrap two
  input-fields in a row container with display: flex; gap: 20px.
-->
<div style="display: flex; flex-direction: column; flex-grow: 1; flex-shrink: 1; flex-basis: 0%; gap: 8px;">
  <div style="font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 500; color: #09090B; line-height: 18px;">{{LABEL}}</div>
  <div style="display: flex; align-items: center; padding: 12px 16px; border: 1px solid #E4E4E7; border-radius: 12px;">
    <div style="font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 400; color: #09090B; line-height: 18px;">{{VALUE}}</div>
  </div>
</div>
