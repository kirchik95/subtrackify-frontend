<!--
  Button — three variants
  
  Copy the variant you need. Placeholder:
    {{LABEL}} — button text (e.g. "Save Changes")
-->

<!-- PRIMARY (dark, filled) -->
<div layer-name="Button Primary" style="display: flex; align-items: center; justify-content: center; height: 40px; padding: 0 16px; background-color: #09090B; border-radius: 12px;">
  <div style="font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 500; color: #FFFFFF; line-height: 18px;">{{LABEL}}</div>
</div>

<!-- OUTLINE (bordered, white bg) -->
<div layer-name="Button Outline" style="display: flex; align-items: center; justify-content: center; height: 40px; padding: 0 16px; background-color: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 12px;">
  <div style="font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 500; color: #09090B; line-height: 18px;">{{LABEL}}</div>
</div>

<!-- DANGER (red, filled) -->
<div layer-name="Button Danger" style="display: flex; align-items: center; justify-content: center; height: 40px; padding: 0 16px; background-color: #DC2626; border-radius: 12px;">
  <div style="font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 500; color: #FFFFFF; line-height: 18px;">{{LABEL}}</div>
</div>

<!-- AUTH SUBMIT (full-width, larger padding) -->
<div layer-name="Button Auth Submit" style="display: flex; align-items: center; justify-content: center; padding: 14px; background-color: #09090B; border-radius: 12px;">
  <div style="font-family: 'Inter', system-ui, sans-serif; font-size: 15px; font-weight: 500; color: #FFFFFF; line-height: 18px;">{{LABEL}}</div>
</div>
